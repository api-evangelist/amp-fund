aid: amp-fund
name: AMP Fund
description: 'AMP (AMP PBC) is a public benefit corporation founded in 2025 by Anjney
  Midha, a former Andreessen Horowitz general partner, to build an independent "AI
  grid" — a pooled compute utility for frontier AI research teams. Rather than operating
  as a cloud provider or a conventional venture firm, AMP acts as an independent system
  operator: data center operators and labs contribute underutilized GPU capacity to
  a shared network, and member research teams draw base-load and burst compute from
  that pool at rates intended to sit below the volatile spot market. AMP pairs capital
  with compute, having raised roughly $1.3 billion for its first fund, and its PBC
  charter is structured so leadership can supply compute at cost without shareholder
  challenge. It has also committed a Public Wealth Fund of up to $500 million through
  2030 toward education, workforce readiness, healthcare access, and economic resilience
  in communities affected by the AI transition. AMP publishes no public API, developer
  portal, or documentation surface as of this enrichment pass.'
